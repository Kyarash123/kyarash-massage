<!doctype html>

<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>سورپرایز عاشقانه</title>  <script src="/_sdk/element_sdk.js"></script>  <style>
    :root {
      --pink: #ff2d8d;
      --hot-pink: #ff0f7b;
      --purple: #8b2cff;
      --violet: #5d22d9;
      --soft-white: rgba(255,255,255,.92);
      --glass: rgba(255,255,255,.10);
    }

    * {
      box-sizing: border-box;
    }

    html {
      min-height: 100%;
    }

    body {
      margin: 0;
      padding: 0;
      min-height: 100vh;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow-x: hidden;
      position: relative;

      background:
        radial-gradient(circle at 15% 20%, rgba(255, 0, 153, .22), transparent 28%),
        radial-gradient(circle at 85% 80%, rgba(119, 0, 255, .25), transparent 30%),
        linear-gradient(135deg, #090014 0%, #160020 45%, #080011 100%);

      color: white;
    }

    /* نورهای محیطی */
    body::before,
    body::after {
      content: "";
      position: fixed;
      width: 420px;
      height: 420px;
      border-radius: 50%;
      filter: blur(90px);
      opacity: .22;
      pointer-events: none;
      z-index: 0;
      animation: ambientGlow 9s ease-in-out infinite alternate;
    }

    body::before {
      background: #ff008c;
      top: -180px;
      right: -120px;
    }

    body::after {
      background: #6c00ff;
      bottom: -200px;
      left: -130px;
      animation-delay: -4s;
    }

    @keyframes ambientGlow {
      0% {
        transform: translate3d(0,0,0) scale(1);
      }
      100% {
        transform: translate3d(40px,-25px,0) scale(1.15);
      }
    }

    .container {
      width: min(92%, 620px);
      padding: 24px;
      position: relative;
      z-index: 2;
    }

    /* کارت اصلی */
    .card {
      position: relative;
      overflow: hidden;
      text-align: center;

      padding: 44px 32px;
      border-radius: 34px;

      background:
        linear-gradient(
          145deg,
          rgba(255,255,255,.15),
          rgba(255,255,255,.055)
        );

      border: 1px solid rgba(255,255,255,.17);

      backdrop-filter: blur(24px) saturate(135%);
      -webkit-backdrop-filter: blur(24px) saturate(135%);

      box-shadow:
        0 35px 100px rgba(0,0,0,.55),
        inset 0 1px 0 rgba(255,255,255,.15),
        inset 0 -1px 0 rgba(255,0,140,.06);

      animation: cardEnter 1s cubic-bezier(.2,.8,.2,1);
    }

    @keyframes cardEnter {
      from {
        opacity: 0;
        transform: translateY(35px) scale(.94);
      }
      to {
        opacity: 1;
        transform: translateY(0) scale(1);
      }
    }

    /* خط نور بالای کارت */
    .card::before {
      content: "";
      position: absolute;
      top: 0;
      left: 8%;
      width: 84%;
      height: 1px;

      background: linear-gradient(
        90deg,
        transparent,
        rgba(255,255,255,.8),
        rgba(255,45,141,.8),
        transparent
      );

      box-shadow: 0 0 18px rgba(255,45,141,.7);
    }

    .card::after {
      content: "";
      position: absolute;
      width: 280px;
      height: 280px;
      border-radius: 50%;
      top: -170px;
      left: -120px;

      background: radial-gradient(
        circle,
        rgba(255,255,255,.13),
        transparent 68%
      );

      pointer-events: none;
      animation: shineMove 7s ease-in-out infinite;
    }

    @keyframes shineMove {
      0%,100% {
        transform: translate(0,0);
      }
      50% {
        transform: translate(180px,90px);
      }
    }

    /* قلب‌های پس‌زمینه */
    .hearts-bg {
      position: absolute;
      inset: 0;
      pointer-events: none;
      overflow: hidden;
      z-index: 0;
    }

    .heart {
      position: absolute;
      bottom: -40px;
      font-size: 20px;
      opacity: 0;
      filter: drop-shadow(0 0 8px rgba(255,50,150,.55));
      animation: float-heart linear forwards;
    }

    @keyframes float-heart {
      0% {
        transform:
          translate3d(0,40px,0)
          rotate(0deg)
          scale(.7);
        opacity: 0;
      }

      12% {
        opacity: .7;
      }

      50% {
        transform:
          translate3d(25px,-260px,0)
          rotate(120deg)
          scale(1);
      }

      88% {
        opacity: .45;
      }

      100% {
        transform:
          translate3d(-35px,-620px,0)
          rotate(300deg)
          scale(.8);
        opacity: 0;
      }
    }

    /* عنوان */
    .title {
      position: relative;
      z-index: 2;

      margin: 0 0 12px;

      font-size: 2.45em;
      font-weight: 800;
      line-height: 1.35;

      color: #fff;

      background: linear-gradient(
        90deg,
        #fff,
        #ffd6ed,
        #ff65ad,
        #fff
      );

      background-size: 250% auto;
      -webkit-background-clip: text;
      background-clip: text;
      -webkit-text-fill-color: transparent;

      text-shadow:
        0 0 25px rgba(255,45,141,.25);

      animation:
        titleGlow 3s ease-in-out infinite,
        titleGradient 6s linear infinite;
    }

    @keyframes titleGlow {
      0%,100% {
        filter: drop-shadow(0 0 4px rgba(255,45,141,.15));
      }
      50% {
        filter: drop-shadow(0 0 18px rgba(255,45,141,.5));
      }
    }

    @keyframes titleGradient {
      to {
        background-position: 250% center;
      }
    }

    .subtitle {
      position: relative;
      z-index: 2;

      margin: 0 0 32px;

      font-size: 1.15em;
      color: rgba(255,255,255,.78);

      letter-spacing: .2px;
    }

    /* موزیک پلیر */
    .music-player {
      position: relative;
      z-index: 2;

      padding: 30px 22px;
      margin: 30px 0;

      border-radius: 26px;

      background:
        linear-gradient(
          135deg,
          rgba(255,20,130,.82),
          rgba(111,25,220,.88)
        );

      border: 1px solid rgba(255,255,255,.2);

      box-shadow:
        0 18px 45px rgba(255,0,130,.20),
        inset 0 1px 0 rgba(255,255,255,.2);

      overflow: hidden;
    }

    .music-player::before {
      content: "";
      position: absolute;
      width: 180px;
      height: 180px;
      border-radius: 50%;
      background: rgba(255,255,255,.10);
      top: -110px;
      right: -50px;
      filter: blur(3px);
    }

    .music-player::after {
      content: "";
      position: absolute;
      width: 130%;
      height: 1px;
      left: -15%;
      bottom: 0;

      background: linear-gradient(
        90deg,
        transparent,
        rgba(255,255,255,.5),
        transparent
      );

      animation: playerLight 3s linear infinite;
    }

    @keyframes playerLight {
      from {
        transform: translateX(-40%);
      }
      to {
        transform: translateX(40%);
      }
    }

    .music-icon {
      position: relative;
      z-index: 2;

      width: 82px;
      height: 82px;
      margin: 0 auto 20px;

      display: flex;
      align-items: center;
      justify-content: center;

      border-radius: 50%;

      font-size: 2.7em;

      background: rgba(255,255,255,.14);
      border: 1px solid rgba(255,255,255,.25);

      box-shadow:
        0 0 0 8px rgba(255,255,255,.035),
        0 0 35px rgba(255,255,255,.15);

      animation: rotate 4s linear infinite;
    }

    @keyframes rotate {
      from {
        transform: rotate(0deg);
      }
      to {
        transform: rotate(360deg);
      }
    }

    .music-icon.paused {
      animation-play-state: paused;
    }

    /* دکمه پخش */
    .play-button,
    .next-button {
      position: relative;
      overflow: hidden;

      border: none;
      cursor: pointer;

      color: #fff;

      padding: 15px 38px;
      border-radius: 999px;

      font-size: 1.05em;
      font-weight: 700;

      background:
        linear-gradient(
          135deg,
          #fff,
          #ffe7f4
        );

      color: #d40073;

      box-shadow:
        0 10px 25px rgba(0,0,0,.22),
        inset 0 1px 0 rgba(255,255,255,.9);

      transition:
        transform .25s ease,
        box-shadow .25s ease;
    }

    .play-button::before,
    .next-button::before {
      content: "";
      position: absolute;
      top: 0;
      left: -120%;
      width: 70%;
      height: 100%;

      transform: skewX(-25deg);

      background: linear-gradient(
        90deg,
        transparent,
        rgba(255,255,255,.65),
        transparent
      );

      transition: left .6s ease;
    }

    .play-button:hover::before,
    .next-button:hover::before {
      left: 150%;
    }

    .play-button:hover,
    .next-button:hover {
      transform: translateY(-4px) scale(1.025);

      box-shadow:
        0 16px 32px rgba(0,0,0,.28),
        0 0 25px rgba(255,45,141,.22);
    }

    .play-button:active,
    .next-button:active {
      transform: translateY(-1px) scale(.99);
    }

    /* پیام‌ها */
    .messages-container {
      display: none;
      position: relative;
      z-index: 2;
    }

    .messages-container.active {
      display: block;
      animation: messagesEnter .9s cubic-bezier(.2,.8,.2,1);
    }

    @keyframes messagesEnter {
      from {
        opacity: 0;
        transform: translateY(25px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .message {
      position: relative;
      overflow: hidden;

      padding: 25px 22px;
      margin: 20px 0;

      border-radius: 22px;

      font-size: 1.2em;
      line-height: 1.8;

      color: #fff;

      background:
        linear-gradient(
          135deg,
          rgba(255,70,160,.23),
          rgba(160,70,255,.18)
        );

      border: 1px solid rgba(255,255,255,.13);

      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);

      box-shadow:
        0 12px 30px rgba(0,0,0,.18),
        inset 0 1px 0 rgba(255,255,255,.08);

      opacity: 0;
      transform: scale(.88) translateY(20px);

      transition:
        opacity .65s ease,
        transform .65s cubic-bezier(.2,.8,.2,1);
    }

    .message::before {
      content: "♥";

      position: absolute;
      top: 7px;
      left: 14px;

      font-size: .7em;
      opacity: .28;

      filter: drop-shadow(0 0 7px rgba(255,50,150,.7));
    }

    .message.show {
      opacity: 1;
      transform: scale(1) translateY(0);
    }

    /* دکمه پیام بعدی */
    .next-button {
      margin-top: 22px;

      background:
        linear-gradient(
          135deg,
          #ff2d8d,
          #7b2cff
        );

      color: white;

      border: 1px solid rgba(255,255,255,.16);

      box-shadow:
        0 12px 30px rgba(120,0,255,.25),
        0 6px 18px rgba(255,0,120,.2);
    }

    /* پیام نهایی */
    .final-message {
      display: none;

      position: relative;
      margin-top: 32px;

      font-size: 1.5em;
      font-weight: 800;

      color: #fff;

      text-shadow:
        0 0 12px rgba(255,60,160,.7),
        0 0 35px rgba(255,60,160,.35);

      animation: heartbeat 1.7s ease-in-out infinite;
    }

    .final-message.show {
      display: block;
    }

    @keyframes heartbeat {
      0%,100% {
        transform: scale(1);
      }
      18% {
        transform: scale(1.06);
      }
      32% {
        transform: scale(1);
      }
      48% {
        transform: scale(1.045);
      }
      65% {
        transform: scale(1);
      }
    }

    /* ستاره‌های ریز */
    .card .spark {
      position: absolute;
      width: 3px;
      height: 3px;
      border-radius: 50%;
      background: white;
      opacity: .45;
      box-shadow: 0 0 10px white;
      animation: sparkle 3s ease-in-out infinite;
    }

    @keyframes sparkle {
      0%,100% {
        opacity: .15;
        transform: scale(.7);
      }
      50% {
        opacity: .8;
        transform: scale(1.5);
      }
    }

    /* موبایل */
    @media (max-width: 600px) {
      .container {
        width: 94%;
        padding: 14px;
      }

      .card {
        padding: 34px 19px;
        border-radius: 28px;
      }

      .title {
        font-size: 1.95em;
      }

      .subtitle {
        font-size: 1em;
        margin-bottom: 25px;
      }

      .music-player {
        padding: 25px 17px;
        border-radius: 22px;
      }

      .music-icon {
        width: 72px;
        height: 72px;
        font-size: 2.3em;
      }

      .message {
        font-size: 1em;
        padding: 20px 17px;
      }

      .play-button,
      .next-button {
        padding: 14px 30px;
        font-size: 1em;
      }

      .final-message {
        font-size: 1.25em;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      *,
      *::before,
      *::after {
        animation-duration: .01ms !important;
        animation-iteration-count: 1 !important;
        scroll-behavior: auto !important;
      }
    }
  </style>  <style>
    @view-transition {
      navigation: auto;

  </style>  <script src="/_sdk/data_sdk.js" type="text/javascript"></script>  <script src="https://cdn.tailwindcss.com" type="text/javascript"></script></head><body>  <div class="container">
    <div class="card">  <div class="hearts-bg" id="heartsContainer"></div>

  <span class="spark" style="top:18%;left:12%;animation-delay:.2s"></span>
  <span class="spark" style="top:32%;right:10%;animation-delay:1s"></span>
  <span class="spark" style="bottom:22%;left:8%;animation-delay:1.8s"></span>
  <span class="spark" style="bottom:12%;right:14%;animation-delay:2.4s"></span>

  <h1 class="title" id="mainTitle">
    💝کیارش ی پیام برات داره 💝
  </h1>

  <p class="subtitle" id="subtitle">
    برای تو با عشق آماده شده
  </p>

  <div class="music-player" id="musicPlayer">

    <div class="music-icon" id="musicIcon">
      🎵
    </div>

    <button class="play-button" id="playButton">
      پخش موزیک
    </button>

  </div>

  <div class="messages-container" id="messagesContainer">

    <div class="message" id="message1">
      تو نور زندگی منی ✨
    </div>

    <div class="message" id="message2">
      هر لحظه با تو، یک خاطره زیباست 🌹
    </div>

    <div class="message" id="message3">
      دوستت دارم تا ابدیت 💕
    </div>

    <button class="next-button" id="nextButton">
      پیام بعدی
    </button>

    <div class="final-message" id="finalMessage">

    </div>

  </div>
</div>

  </div>  <script>
    const defaultConfig = {
      main_title: "💝کیارش ی پیام برات داره 💝",
      subtitle: "دکمه پایین صفحه رو بزن",
      message_1: "خواستم فقط بگم خیلی خوشحالم که کنارمی :)",
      message_2: "هر لحظه با تو، شیرین ترین خاطره هارو برام میسازه،دوستت دارم دیوونه :) 💕",
      message_3: "دوست دارم موندنی ترینم باشی و منم در ازاش:👇",
      final_message: "همیشه کنارت هستم ❤️",
      font_family: "Segoe UI",
      font_size: 16
    };

    let currentMessageIndex = 0;
    let isPlaying = false;

    const audio = new Audio('./Asef Aria - Hale Delam.mp3');
    audio.loop = true;

    function createFloatingHearts() {
      const container = document.getElementById('heartsContainer');
      const hearts = ['❤️', '💕', '💖', '💗', '💝'];

      setInterval(() => {

        const heart = document.createElement('div');

        heart.className = 'heart';
        heart.textContent =
          hearts[Math.floor(Math.random() * hearts.length)];

        heart.style.left = Math.random() * 100 + '%';
        heart.style.fontSize =
          (Math.random() * 13 + 13) + 'px';

        heart.style.animationDuration =
          (Math.random() * 3 + 4) + 's';

        container.appendChild(heart);

        setTimeout(() => {
          heart.remove();
        }, 7000);

      }, 800);
    }

    document.getElementById('playButton').addEventListener('click', function() {

      const musicIcon = document.getElementById('musicIcon');
      const playButton = document.getElementById('playButton');
      const musicPlayer = document.getElementById('musicPlayer');
      const messagesContainer = document.getElementById('messagesContainer');

      if (!isPlaying) {

        isPlaying = true;

        audio.play().catch(error => {
          console.error('خطا در پخش موزیک:', error);
        });

        playButton.textContent = 'در حال پخش...';
        musicIcon.classList.remove('paused');

        setTimeout(() => {
          musicPlayer.style.display = 'none';
          messagesContainer.classList.add('active');
          showMessage(0);
        }, 2000);
      }
    });

    function showMessage(index) {

      const messages =
        document.querySelectorAll('.message');

      if (index < messages.length) {

        setTimeout(() => {
          messages[index].classList.add('show');
        }, 500);

      }
    }

    document.getElementById('nextButton').addEventListener('click', function() {

      const messages =
        document.querySelectorAll('.message');

      currentMessageIndex++;

      if (currentMessageIndex < messages.length) {

        showMessage(currentMessageIndex);

      } else {

        document.getElementById('nextButton').style.display = 'none';

        document.getElementById('finalMessage')
          .classList.add('show');
      }
    });

    async function onConfigChange(config) {

      const customFont =
        config.font_family || defaultConfig.font_family;

      const baseFontStack =
        'Tahoma, Geneva, Verdana, sans-serif';

      const baseSize =
        config.font_size || defaultConfig.font_size;

      document.body.style.fontFamily =
        `${customFont}, ${baseFontStack}`;

      document.body.style.background =
        `
        radial-gradient(circle at 15% 20%,
          rgba(255, 0, 153, .22),
          transparent 28%),
        radial-gradient(circle at 85% 80%,
          rgba(119, 0, 255, .25),
          transparent 30%),
        linear-gradient(
          135deg,
          ${config.background_color || '#090014'} 0%,
          #160020 45%,
          ${config.button_color || '#080011'} 100%
        )
        `;

      const card =
        document.querySelector('.card');

      card.style.background =
        `linear-gradient(
          145deg,
          rgba(255,255,255,.15),
          rgba(255,255,255,.055)
        )`;

      const title =
        document.getElementById('mainTitle');

      title.textContent =
        config.main_title || defaultConfig.main_title;

      title.style.color =
        config.text_color || '#ffffff';

      title.style.fontSize =
        `${baseSize * 2.5}px`;

      title.style.fontFamily =
        `${customFont}, ${baseFontStack}`;

      const subtitle =
        document.getElementById('subtitle');

      subtitle.textContent =
        config.subtitle || defaultConfig.subtitle;

      subtitle.style.color =
        config.button_color || '#ff2d8d';

      subtitle.style.fontSize =
        `${baseSize * 1.2}px`;

      subtitle.style.fontFamily =
        `${customFont}, ${baseFontStack}`;

      const musicPlayer =
        document.querySelector('.music-player');

      musicPlayer.style.background =
        `linear-gradient(
          135deg,
          ${config.background_color || '#ff1493'} 0%,
          ${config.button_color || '#7025e8'} 100%
        )`;

      const playButton =
        document.getElementById('playButton');

      playButton.style.fontSize =
        `${baseSize * 1.1}px`;

      playButton.style.fontFamily =
        `${customFont}, ${baseFontStack}`;

      const messageIds =
        ['message1', 'message2', 'message3'];

      const configKeys =
        ['message_1', 'message_2', 'message_3'];

      messageIds.forEach((id, index) => {

        const message =
          document.getElementById(id);

        message.textContent =
          config[configKeys[index]] ||
          defaultConfig[configKeys[index]];

        message.style.fontSize =
          `${baseSize * 1.2}px`;

        message.style.fontFamily =
          `${customFont}, ${baseFontStack}`;
      });

      const nextButton =
        document.getElementById('nextButton');

      nextButton.style.fontSize =
        `${baseSize * 1.1}px`;

      nextButton.style.fontFamily =
        `${customFont}, ${baseFontStack}`;

      const finalMessage =
        document.getElementById('finalMessage');

      finalMessage.textContent =
        config.final_message ||
        defaultConfig.final_message;

      finalMessage.style.color =
        config.text_color || '#ffffff';

      finalMessage.style.fontSize =
        `${baseSize * 1.5}px`;

      finalMessage.style.fontFamily =
        `${customFont}, ${baseFontStack}`;
    }

    if (window.elementSdk) {

      window.elementSdk.init({

        defaultConfig,

        onConfigChange,

        mapToCapabilities: (config) => ({

          recolorables: [

            {
              get: () =>
                config.background_color ||
                defaultConfig.background_color,

              set: (value) => {
                config.background_color = value;
                window.elementSdk.setConfig({
                  background_color: value
                });
              }
            },

            {
              get: () =>
                config.card_color ||
                defaultConfig.card_color,

              set: (value) => {
                config.card_color = value;
                window.elementSdk.setConfig({
                  card_color: value
                });
              }
            },

            {
              get: () =>
                config.text_color ||
                defaultConfig.text_color,

              set: (value) => {
                config.text_color = value;
                window.elementSdk.setConfig({
                  text_color: value
                });
              }
            },

            {
              get: () =>
                config.button_color ||
                defaultConfig.button_color,

              set: (value) => {
                config.button_color = value;
                window.elementSdk.setConfig({
                  button_color: value
                });
              }
            },

            {
              get: () =>
                config.message_bg_color ||
                defaultConfig.message_bg_color,

              set: (value) => {
                config.message_bg_color = value;
                window.elementSdk.setConfig({
                  message_bg_color: value
                });
              }
            }

          ],

          borderables: [],

          fontEditable: {

            get: () =>
              config.font_family ||
              defaultConfig.font_family,

            set: (value) => {

              config.font_family = value;

              window.elementSdk.setConfig({
                font_family: value
              });

            }
          },

          fontSizeable: {

            get: () =>
              config.font_size ||
              defaultConfig.font_size,

            set: (value) => {

              config.font_size = value;

              window.elementSdk.setConfig({
                font_size: value
              });

            }
          }

        }),

        mapToEditPanelValues: (config) =>
          new Map([

            [
              "main_title",
              config.main_title ||
              defaultConfig.main_title
            ],

            [
              "subtitle",
              config.subtitle ||
              defaultConfig.subtitle
            ],

            [
              "message_1",
              config.message_1 ||
              defaultConfig.message_1
            ],

            [
              "message_2",
              config.message_2 ||
              defaultConfig.message_2
            ],

            [
              "message_3",
              config.message_3 ||
              defaultConfig.message_3
            ],

            [
              "final_message",
              config.final_message ||
              defaultConfig.final_message
            ]

          ])
      });
    }

    createFloatingHearts();
    onConfigChange(defaultConfig);
  </script></body>
</html>
